<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Pin Gradient (Sleek Navigator Blue) -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <!-- Shadow for the pin -->
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#01579B" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Blue Geo-Pin Shape with center cutout, centered vertically and horizontally -->
  <g transform="translate(0, 16)">
    <path d="M 256 420 C 170 330 130 260 130 180 C 130 110 186 60 256 60 C 326 60 382 110 382 180 C 382 260 342 330 256 420 Z M 256 230 C 283.6 230 306 207.6 306 180 C 306 152.4 283.6 130 256 130 C 228.4 130 206 152.4 206 180 C 206 207.6 228.4 230 256 230 Z" 
          fill="url(#pinGrad)" 
          fill-rule="evenodd" 
          filter="url(#pinShadow)" />
  </g>
</svg>
